# Env is inline so `docker compose up --build` works from a clean clone with no .env file.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U food -d food']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://food:food@postgres:5432/food
      PORT: 3000
      JWT_SECRET: dev-secret-change-me
      OTP_DEV_MODE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
