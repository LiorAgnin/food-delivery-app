name: food_delivery
description: LevelApp food-delivery client.
publish_to: 'none'
version: 1.0.0+1

environment:
  # freezed 4 requires Dart >=3.13.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^16.2.0
  http: ^1.6.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  patrol: ^4.9.0
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8

flutter:
  uses-material-design: true

# Patrol e2e. No product flavors; Android package matches applicationId.
patrol:
  app_name: food_delivery
  android:
    package_name: com.levelapp.food_delivery
  ios:
    bundle_id: com.levelapp.foodDelivery
