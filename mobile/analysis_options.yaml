include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.8

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed and json_serializable annotate constructor params.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
